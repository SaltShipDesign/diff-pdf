name: Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf \
            automake \
            g++ \
            make \
            pkg-config \
            xvfb \
            xauth \
            libpoppler-glib-dev \
            poppler-utils \
            libwxgtk3.2-dev

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test
        run: |
          set +e
          xvfb-run --auto-servernum ./diff-pdf-b \
            --dpi=72 \
            --output-diff=test/output-diff.pdf \
            test/0217-101-001-C.pdf \
            test/0217-101-001-I.pdf
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "Expected diff-pdf-b to return 1 for different PDFs, got $status" >&2
            exit 1
          fi

          test -s test/output-diff.pdf
          bash test/assert-output-pdf-matches-expected.sh test/output-diff.pdf

      - name: Build source archive
        run: make dist

      - name: Package Linux binary
        run: |
          mkdir -p dist/diff-pdf-linux-x86_64
          cp diff-pdf-b dist/diff-pdf-linux-x86_64/diff-pdf
          cp README.md COPYING COPYING.icons AUTHORS dist/diff-pdf-linux-x86_64/
          tar -C dist -czf dist/diff-pdf-linux-x86_64.tar.gz diff-pdf-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff-pdf-linux-x86_64
          path: dist/diff-pdf-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff-pdf-source
          path: diff-pdf-*.tar.gz
          if-no-files-found: error

      - name: Upload smoke test diff PDF
        uses: actions/upload-artifact@v4
        with:
          name: diff-pdf-smoke-test-output
          path: test/output-diff.pdf
          if-no-files-found: error

  manual-docker-image:
    name: Manual Docker image
    runs-on: ubuntu-24.04
    needs:
      - linux

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: diff-pdf-linux-x86_64
          path: artifacts/linux

      - name: Use built diff-pdf binary
        run: |
          mkdir -p artifacts/linux/extracted
          tar -xzf artifacts/linux/diff-pdf-linux-x86_64.tar.gz -C artifacts/linux/extracted
          install -m 755 \
            artifacts/linux/extracted/diff-pdf-linux-x86_64/diff-pdf \
            job-dispatcher/docker/bin/diff-pdf-b

      - name: Build manual Docker image
        run: docker build -f docker-root/Dockerfile -t diff-pdf-image:smoke-test .

      - name: Smoke test manual Docker image
        run: |
          mkdir -p artifacts/manual-docker-image
          set +e
          docker run --rm \
            -v "$PWD/test:/input:ro" \
            -v "$PWD/artifacts/manual-docker-image:/data" \
            diff-pdf-image:smoke-test \
            /input/0217-101-001-C.pdf \
            /input/0217-101-001-I.pdf \
            output-diff.pdf
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected manual Docker image to return 1 for different PDFs, got $exit_code" >&2
            exit 1
          fi

          bash test/assert-output-pdf-matches-expected.sh artifacts/manual-docker-image/output-diff.pdf

  job-dispatcher:
    name: Job dispatcher image
    runs-on: ubuntu-24.04
    needs:
      - linux
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Prepare image metadata
        run: |
          image_tag="${GITHUB_REF_NAME//\//-}"
          image_tag="${image_tag//[^A-Za-z0-9_.-]/-}"
          echo "DISPATCHER_IMAGE=diff-pdf-job-dispatcher:$image_tag" >> "$GITHUB_ENV"
          echo "DISPATCHER_ARTIFACT_TAG=$image_tag" >> "$GITHUB_ENV"

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: diff-pdf-linux-x86_64
          path: artifacts/linux

      - name: Use built diff-pdf binary
        run: |
          mkdir -p artifacts/linux/extracted
          tar -xzf artifacts/linux/diff-pdf-linux-x86_64.tar.gz -C artifacts/linux/extracted
          install -m 755 \
            artifacts/linux/extracted/diff-pdf-linux-x86_64/diff-pdf \
            job-dispatcher/docker/bin/diff-pdf-b
          sha256sum job-dispatcher/docker/bin/diff-pdf-b > artifacts/linux/diff-pdf-b.sha256

      - name: Build job dispatcher image
        run: docker build -f job-dispatcher/Dockerfile -t "$DISPATCHER_IMAGE" .

      - name: Verify image uses built diff-pdf binary
        run: |
          container_id="$(docker create "$DISPATCHER_IMAGE")"
          docker cp "$container_id:/usr/local/bin/diff-pdf-b" artifacts/linux/diff-pdf-b-from-image
          docker rm "$container_id"

          expected="$(cut -d' ' -f1 artifacts/linux/diff-pdf-b.sha256)"
          actual="$(sha256sum artifacts/linux/diff-pdf-b-from-image | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "The job dispatcher image does not contain the diff-pdf binary built by this workflow." >&2
            exit 1
          fi

      - name: Smoke test job dispatcher image
        run: |
          mkdir -p artifacts/job-dispatcher-smoke
          set +e
          docker run --rm \
            -v "$PWD/test:/test:ro" \
            -v "$PWD/artifacts/job-dispatcher-smoke:/out" \
            --entrypoint /bin/sh \
            "$DISPATCHER_IMAGE" \
            -c '/usr/local/bin/diff-pdf /test/0217-101-001-C.pdf /test/0217-101-001-I.pdf --output-diff=/out/output-diff.pdf "$DIFF_PDF_DISPLAY"; exit_code=$?; test -s /out/output-diff.pdf || exit 10; exit "$exit_code"'
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected dispatcher diff-pdf wrapper to return 1 for different PDFs, got $exit_code" >&2
            exit 1
          fi

          bash test/assert-output-pdf-matches-expected.sh artifacts/job-dispatcher-smoke/output-diff.pdf

      - name: Package job dispatcher image
        run: |
          mkdir -p dist
          docker save "$DISPATCHER_IMAGE" | gzip > "dist/diff-pdf-job-dispatcher-$DISPATCHER_ARTIFACT_TAG.tar.gz"

      - name: Upload job dispatcher image artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff-pdf-job-dispatcher-image
          path: dist/diff-pdf-job-dispatcher-*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs:
      - linux
      - manual-docker-image
      - job-dispatcher
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/* --clobber
          else
            gh release create "$TAG_NAME" release-artifacts/* \
              --title "Release $TAG_NAME" \
              --notes "Automated release for $TAG_NAME"
          fi
